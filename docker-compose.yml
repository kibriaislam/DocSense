services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      ollama:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=ragdb;Username=postgres;Password=${POSTGRES_PASSWORD}
      Ollama__BaseUrl: http://ollama:11434
      Ollama__EmbedModel: nomic-embed-text
      Ollama__GenerateModel: llama3.1:8b
      Chunking__ChunkSize: "512"
      Chunking__Overlap: "64"
    env_file:
      - .env

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 10s
      retries: 5

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint:
      - sh
      - -c
      - "sleep 5 && ollama pull nomic-embed-text && ollama pull llama3.1:8b"
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ragdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
    env_file:
      - .env

volumes:
  ollama_data:
  pgdata:
